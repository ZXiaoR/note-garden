<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 1. 模切贴纸奶油色外白边与蓝墨水粗描边 -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="18" fill="#FFFDF7" stroke="#2848D8" stroke-width="4"/>
  <!-- 2. 芥末黄手账内底色 -->
  <rect x="8" y="8" width="48" height="48" rx="14" fill="#F6C84C"/>

  <!-- 3. 小女孩蓬松波波头后发 (深海蓝墨色) -->
  <path d="M13 42 C 11 24, 20 14, 32 14 C 44 14, 53 24, 51 42 C 50 50, 46 53, 42 52 L 22 52 C 18 53, 14 50, 13 42 Z"
        fill="#1E2D7D" stroke="#2848D8" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- 4. 头顶知识花园薄荷绿小嫩芽 -->
  <path d="M32 14 C 31 7, 23 5, 21 9 C 21 13, 27 14, 32 14 Z"
        fill="#80D8B8" stroke="#2848D8" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M32 14 C 33 7, 41 5, 43 9 C 43 13, 37 14, 32 14 Z"
        fill="#80D8B8" stroke="#2848D8" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- 5. 小耳朵与脸庞 (奶油白) -->
  <circle cx="16.5" cy="39" r="4.2" fill="#FFFDF7" stroke="#2848D8" stroke-width="3"/>
  <circle cx="47.5" cy="39" r="4.2" fill="#FFFDF7" stroke="#2848D8" stroke-width="3"/>
  <path d="M18 36 C 18 24, 24 20, 32 20 C 40 20, 46 24, 46 36 C 46 47, 40 52, 32 52 C 24 52, 18 47, 18 36 Z"
        fill="#FFFDF7" stroke="#2848D8" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- 6. 齐刘海与侧发 + 粉色一字发卡 -->
  <path d="M17 33 C 17 21, 24 16, 32 16 C 40 16, 47 21, 47 33 C 43 27, 39 29, 36 25 C 33 29, 28 29, 25 25 C 22 29, 19 28, 17 33 Z"
        fill="#1E2D7D" stroke="#2848D8" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- 粉色小发卡 -->
  <rect x="40" y="21" width="7.5" height="3.6" rx="1.8" transform="rotate(18 40 21)"
        fill="#F5A4B8" stroke="#2848D8" stroke-width="2"/>

  <!-- 7. 腮红 -->
  <ellipse cx="21.5" cy="43.5" rx="3.2" ry="2" fill="#F5A4B8"/>
  <ellipse cx="42.5" cy="43.5" rx="3.2" ry="2" fill="#F5A4B8"/>

  <!-- 8. 亮眼灵动的豆豆眼 -->
  <circle cx="25.5" cy="38" r="2.3" fill="#2848D8"/>
  <circle cx="38.5" cy="38" r="2.3" fill="#2848D8"/>
  <circle cx="24.8" cy="37.2" r="0.8" fill="#FFFDF7"/>
  <circle cx="37.8" cy="37.2" r="0.8" fill="#FFFDF7"/>

  <!-- 9. 标志性手绘大圆框眼镜 (番茄红镜框 + 镜片反光) -->
  <circle cx="25.5" cy="38" r="6.4" fill="rgba(197, 212, 247, 0.28)" stroke="#E0523C" stroke-width="3"/>
  <circle cx="38.5" cy="38" r="6.4" fill="rgba(197, 212, 247, 0.28)" stroke="#E0523C" stroke-width="3"/>
  <!-- 鼻梁架与镜腿 -->
  <path d="M31.9 37.5 Q 32 36 32.1 37.5" fill="none" stroke="#E0523C" stroke-width="3" stroke-linecap="round"/>
  <path d="M17 36.5 L 19.2 37.2" fill="none" stroke="#E0523C" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M44.8 37.2 L 47 36.5" fill="none" stroke="#E0523C" stroke-width="2.8" stroke-linecap="round"/>
  <!-- 镜片高光斜线 -->
  <path d="M22 34.5 L 24 33" fill="none" stroke="#FFFDF7" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M35 34.5 L 37 33" fill="none" stroke="#FFFDF7" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 10. 微笑嘴角 -->
  <path d="M29 46 C 30.8 48.6, 33.2 48.6, 35 46" fill="none" stroke="#2848D8" stroke-width="2.8" stroke-linecap="round"/>
</svg>
